    #LOC_FFT_fft-fusion-magnetic-inertial-1_title = JP-10 “脉冲” 磁惯性聚变发动机
    #LOC_FFT_fft-fusion-magnetic-inertial-1_description = 一种简单的入门级聚变方式，通过锂制圆柱形等离子衬套并利用磁线圈压缩来实现。磁线圈压缩燃料气体使其发生聚变，可使用氘或氘-氦3混合燃料——采用高性能燃料可提升功率并减少热量生成。该发动机在启动前需要为电能储存单元充电，运行时依然会消耗少量电力。
    #LOC_FFT_fft-fusion-magnetic-inertial-1_tags = inertial magnetic confinement fusion pulse lithium plasma farfuture nuclear msnw impulse

    #LOC_FFT_fft-fusion-inertial-laser-1_title = K-80 “锤舌” 惯性约束激光聚变发动机
    #LOC_FFT_fft-fusion-inertial-laser-1_description = 主点火开始！一组精确计时的高功率激光束汇聚到一个由氘与氦3组成的单个独立燃料丸上，该燃料丸由机载燃料丸工厂制造。外壳汽化会强力压缩燃料，促使核心发生聚变。该型号推进器仅使用反应产物作为喷射物，并通过强大的磁喷管排出，从而获得极高的比冲但推力较低。每个燃料丸中可额外加入氘进料，可适度提升推力。该发动机在启动前需要为电能储存单元充电，但运行时不再消耗能量。
    #LOC_FFT_fft-fusion-inertial-laser-1_tags = pulse inertial laser confinement fusion beam ignition plasma farfuture nuclear hammertong death star


    // Thermal Fusion
    // --------------
    #LOC_FFT_fft-fusion-magnetic-tokamak-1_title = JR-15 “发现号”球形托卡马克聚变发动机
    #LOC_FFT_fft-fusion-magnetic-tokamak-1_description = 这款基础型热聚变发动机采用球形托卡马克设计，将氦-3与氘发生反应。可向排气中注入可变量的液氢，以提高推力，但会降低效率。该发动机需要先为其电力单元充电才能启动，但一旦启动，即使发动机不运行，也可依靠机载聚变燃料稳定输出约 500 千瓦的电力。保持反应堆以此方式运行，可实现瞬时油门响应。记得携带散热器！
    #LOC_FFT_fft-fusion-magnetic-tokamak-1_tags = fusion thermal plas nuclear rocket tokamak farfuture spher discovery

    #LOC_FFT_fft-fusion-magnetic-mirror-1_title = JR-45 “菲涅尔”镜腔聚变发动机
    #LOC_FFT_fft-fusion-magnetic-mirror-1_description = 气体动力镜发动机的细长等离子体腔舍弃了长时间约束等离子体的设计理念，反而采取“直接把它沿着一条又长又窄的通道抛出去，指望它在末端融合成功”的思路。这种方式能释放大量能量，并获得极高的聚变增益。可选地向等离子体中注入氢以增加推力。反应腔长度决定了发动机性能——更长的腔体造价和重量更高，但性能收益也更可观。该发动机需要先为其电力单元充电才能启动，但一旦启动，即使发动机不运行，也可依靠机载聚变燃料稳定输出约 250 千瓦的电力。保持反应堆以此方式运行，可实现瞬时油门响应。记得携带散热器！
    #LOC_FFT_fft-fusion-magnetic-mirror-1_tags = fusion thermal plas nuclear rocket gasdynamic mirror cell farfuture fresnel

    #LOC_FFT_fft-fusion-magnetic-tokamak-aerospike-1_title = JR-20A “衔尾蛇”环形托卡马克聚变发动机
    #LOC_FFT_fft-fusion-magnetic-tokamak-aerospike-1_description = 这款先进的磁约束聚变发动机采用球形托卡马克设计，将氦-3与氘发生反应。反应系统经过优化，可加热大量液氢，从而获得较高推力，但比冲远低于其他聚变系统。采用的锥形喷管（气动尖峰喷管）可在大气环境下高效工作。为减轻重量，该发动机在运行时并不会产生显著的额外电力，但保持反应堆活跃可实现瞬时油门响应。记得携带散热器！
    #LOC_FFT_fft-fusion-magnetic-tokamak-aerospike-1_tags = fusion thermal plas nuclear rocket tokamak farfuture aerospike op hax ouroboros

